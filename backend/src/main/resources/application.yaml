spring:
  application:
    name: mlog

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost/mlog?useSSL=false&serverTimezone=UTC
    username: root
    password: Parkminwoo0402+

  redis:
    host: 127.0.0.1
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.mlog: debug
  pattern:
    dateformat: mm:ss.SSS

jwt:
  secret: mlog-jwt-secret-key-for-login-token
  expire: 86400000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true